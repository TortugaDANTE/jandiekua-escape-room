<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003B71">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Mar de las Ideas · Escape room virtual · Revista Jandiekua</title>
  <meta name="description" content="Escape room virtual de inducción a la publicación científica de la Revista Jandiekua, Agenda Ambiental UASLP.">
  <link rel="stylesheet" href="css/juego.css?v=20261112e">
</head>
<body>
  <div id="escenario">
    <div id="lienzo" role="application" aria-label="Mar de las Ideas, escape room virtual de la Revista Jandiekua">
      <div id="fondo" aria-hidden="true">
        <img src="assets/disenografico/fondo_mar.svg" alt="">
      </div>

      <header class="barra">
        <img src="assets/logos/logo_banner_blanco.png" width="2890" height="590" alt="Universidad Autónoma de San Luis Potosí y Agenda Ambiental">
      </header>

      <div class="franja-llaves" id="franja-llaves" hidden>
        <ol class="llaves" id="llaves" aria-label="Llaves obtenidas"></ol>
        <button type="button" class="btn-glosario" id="btn-glosario" aria-haspopup="dialog">Glosario</button>
      </div>

      <main id="escena"></main>

      <footer class="pie">ext. 7200 y 7210</footer>
    </div>
  </div>

  <div id="modal-glosario" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="glosario-titulo">
    <div class="modal-carta">
      <header>
        <p class="kicker">Códice editorial</p>
        <h2 id="glosario-titulo">Glosario</h2>
        <button type="button" class="cerrar" id="cerrar-glosario" aria-label="Cerrar glosario">×</button>
      </header>
      <div class="modal-cuerpo" id="glosario-cuerpo"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <script src="js/juego.js?v=20261112e"></script>
</body>
</html>
