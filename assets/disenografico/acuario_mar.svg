<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 605" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C59B27" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#8A6A12" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5C4A18" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8E8DF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D8E8DF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="alga" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E6B4E"/>
      <stop offset="1" stop-color="#4A8B68" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <!-- caustics / refraction bands -->
  <g opacity=".22" fill="none" stroke="#D8E8DF" stroke-width="1.2">
    <path d="M0 90 Q180 70 360 100 T720 90 T1080 110" opacity=".7"/>
    <path d="M0 130 Q200 150 400 120 T800 140 T1080 125" opacity=".45"/>
    <path d="M0 170 Q160 155 320 180 T640 165 T1080 185" opacity=".35"/>
  </g>
  <!-- light rays -->
  <g fill="url(#rayo)">
    <polygon points="220,-10 310,-10 260,400 170,400" opacity=".8"/>
    <polygon points="520,-10 590,-10 560,360 490,360" opacity=".55"/>
    <polygon points="820,-10 900,-10 870,420 790,420" opacity=".65"/>
  </g>
  <!-- sand bottom -->
  <path fill="url(#arena)" d="M0 500 C80 488 160 520 260 505 C360 488 470 525 580 508 C700 490 820 528 930 510 C1000 500 1040 518 1080 508 L1080 605 L0 605 Z"/>
  <g fill="#C59B27" opacity=".2">
    <circle cx="90" cy="560" r="4"/><circle cx="140" cy="575" r="3"/><circle cx="320" cy="568" r="3.5"/>
    <circle cx="510" cy="580" r="4"/><circle cx="700" cy="565" r="3"/><circle cx="880" cy="578" r="4"/>
    <circle cx="990" cy="555" r="2.5"/>
  </g>
  <!-- seaweed / coral, left -->
  <g fill="url(#alga)" opacity=".85">
    <path d="M70 605 C60 540 90 520 70 460 C50 400 95 390 80 330 C88 400 55 420 85 480 C100 530 55 550 70 605Z"/>
    <path d="M110 605 C125 530 95 510 120 440 C140 380 100 370 115 320 C108 380 145 400 108 470 C90 530 130 560 110 605Z"/>
    <path d="M40 605 C30 550 55 530 38 480 C22 430 58 425 48 390 C52 440 20 455 50 510 C62 545 28 565 40 605Z"/>
  </g>
  <!-- right -->
  <g fill="url(#alga)" opacity=".8">
    <path d="M1010 605 C1022 540 990 520 1015 455 C1038 400 990 390 1008 335 C1000 400 1040 420 1000 485 C985 535 1028 555 1010 605Z"/>
    <path d="M1050 605 C1062 550 1038 535 1055 485 C1072 435 1038 428 1050 390 C1045 440 1078 455 1048 510 C1036 545 1068 565 1050 605Z"/>
    <path d="M970 605 C955 545 990 525 968 470 C948 415 990 410 975 360 C980 420 945 435 985 500 C1000 545 958 560 970 605Z"/>
  </g>
  <!-- small coral clusters -->
  <g fill="#C59B27" opacity=".35">
    <path d="M200 600 l8-28 8 14 7-22 7 22 8-14 8 28z"/>
    <path d="M860 600 l6-22 7 11 6-18 6 18 7-11 6 22z"/>
  </g>
  <!-- two slow fish silhouettes (animated via CSS on groups) -->
  <g class="pez pez-a" fill="#102438" opacity=".28">
    <ellipse cx="0" cy="0" rx="22" ry="10"/>
    <polygon points="18,0 34,-9 34,9"/>
    <circle cx="-8" cy="-2" r="1.4" fill="#D8E8DF" opacity=".8"/>
  </g>
  <g class="pez pez-b" fill="#102438" opacity=".2">
    <ellipse cx="0" cy="0" rx="16" ry="7"/>
    <polygon points="-14,0 -26,-7 -26,7"/>
    <circle cx="6" cy="-1.5" r="1.1" fill="#D8E8DF" opacity=".8"/>
  </g>
</svg>
